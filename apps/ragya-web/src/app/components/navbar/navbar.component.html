<header class="navbar">
  <div class="navbar-inner">
    <button class="brand" type="button" (click)="scrollTo('home')" aria-label="Go to home">
      <img src="/logo.png" alt="A1 Spice N' Greens logo" />
      <span class="brand-copy">
        <strong>A1 SPICE N' GREENS</strong>
        <small>Goodness of nature</small>
      </span>
    </button>

    <nav class="nav-links" [class.open]="isMenuOpen" aria-label="Main navigation">
      @for (item of navItems; track item.target) {
        <button
          type="button"
          [class.active]="activeSection === item.target"
          (click)="scrollTo(item.target)">
          {{ item.label }}
        </button>
      }
    </nav>

    <button
      class="contact-btn"
      type="button"
      (click)="scrollTo('contact')">
      <span aria-hidden="true">✉</span>
      CONTACT US
    </button>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation">
      <i></i><i></i><i></i>
    </button>
  </div>
</header>
