<section id="contact" class="contact"><div class="contact-inner"><div class="copy"><span>GET IN TOUCH</span><h2>WE'D LOVE TO<br><strong>HEAR FROM YOU</strong></h2><i></i><p>Have a question, feedback or bulk enquiry?<br>We are here to help you.</p><a class="email" href="mailto:a1spicegreens@gmail.com">✉ <strong>a1spicegreens@gmail.com</strong></a><a class="email-button" href="mailto:a1spicegreens@gmail.com">SEND US AN EMAIL ➤</a></div>
<form class="form" #f="ngForm" (ngSubmit)="submit(f)" novalidate><div class="row"><label>Your Name<input name="name" ngModel required autocomplete="name" placeholder="Your Name"></label><label>Your Email<input name="email" ngModel required email autocomplete="email" placeholder="Your Email"></label></div><label>Subject<input name="subject" ngModel placeholder="Subject"></label><label>Message<textarea name="message" ngModel required rows="6" placeholder="Message"></textarea></label><button type="submit">SEND MESSAGE ➤</button>@if(submitted){<p class="sent">Your email application should open with the enquiry details.</p>}</form></div></section>
