<section id="home" class="hero">
  <div class="hero-background" aria-hidden="true">
    <div class="wheat wheat-left"></div>
    <div class="wheat wheat-right"></div>
  </div>

  <div class="hero-inner">
    <div class="hero-copy">
      <span class="eyebrow">PREMIUM QUALITY</span>

      <h1>RAGYA</h1>

      <p class="hero-title">— PREMIUM QUALITY ATTA —</p>

      <p class="hero-description">
        Tradition in every grain.<br />
        Quality for every home.
      </p>

      <button class="primary-btn" type="button" (click)="scrollToProducts()">
        EXPLORE RAGYA
        <span aria-hidden="true">➤</span>
      </button>

      <div class="brand-line">
        <span>A brand by</span>
        <div>
          <img src="/logo.png" alt="A1 Spice N' Greens" />
          <strong>A1 SPICE N' GREENS</strong>
        </div>
      </div>
    </div>

    <div class="hero-products" aria-label="Ragya Atta products">
      <div class="hero-glow" aria-hidden="true"></div>

      <img
        src="/atta-10kg.png"
        alt="Ragya Premium Quality Atta 10 KG"
        class="atta-large" />

      <img
        src="/atta-5kg.png"
        alt="Ragya Premium Quality Atta 5 KG"
        class="atta-small" />

      <div class="grain-bowl" aria-hidden="true">
        <div class="bowl"></div>
        <div class="flour"></div>
      </div>
    </div>
  </div>

  <button class="hero-arrow hero-arrow-left" type="button" aria-label="Previous slide">‹</button>
  <button class="hero-arrow hero-arrow-right" type="button" aria-label="Next slide">›</button>

  <div class="hero-dots" aria-hidden="true">
    <span class="active"></span>
    <span></span>
    <span></span>
    <span></span>
  </div>
</section>
